[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfarmview-gateway-node"
version = "0.1.0"
description = "SecurityMesh Gateway Node — power-budget brain, MQTT broker host, mesh + uplink coordination"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "paho-mqtt>=2.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "structlog>=23.0",
    "python-dotenv>=1.0",
    # Shared solar power-budget decision logic (pure, no deps). Installed from
    # the monorepo: CI/deploy run `pip install -e ../power-policy` first, which
    # satisfies this requirement (it is not published to PyPI).
    "smartfarmview-power-policy",
]

[project.optional-dependencies]
hardware = [
    "picamera2>=0.3",
]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[project.scripts]
gateway-power = "gateway_node.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["paho.*", "picamera2.*"]
ignore_missing_imports = true
