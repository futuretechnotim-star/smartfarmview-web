# Persistent, size-bounded journald storage for the gateway.
#
# Default journald storage is volatile (tmpfs) on most Pi images — logs vanish
# on every reboot. Found live 2026-07-31: after an overnight hang that needed
# a manual PSU restart, there was no journal history at all from before the
# restart to diagnose what actually happened. Installed to
# /etc/systemd/journald.conf.d/gateway-persistent.conf by pi-setup.sh.
#
# Bounds keep this from growing unbounded on the gateway's SD/eMMC: ~1 week of
# retention, capped at 500M total regardless of retention (a noisy day of
# tailscaled/backhaul-select/wwan-watchdog churn shouldn't blow past that).
# Re-tune SystemMaxUse once real field log volume is known.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=500M
SystemMaxFileSize=50M
MaxRetentionSec=1week
