[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smartfarmview-power-policy"
version = "0.1.0"
description = "SecurityMesh shared solar power-budget policy — pure NORMAL/ECO/LOW/CRITICAL decision logic"
requires-python = ">=3.12"
# Intentionally dependency-free: pure stdlib so any node (Pi Zero field node,
# Pi 5 gateway) can import the decision logic without pulling in hardware deps.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.3",
    "mypy>=1.8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
power_policy = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
