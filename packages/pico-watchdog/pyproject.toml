# This is firmware (MicroPython), not a pip-installable package.
# [project] is declared only to support `pip install -e ".[dev]"` for dev tooling.
# The hardware glue (main/modbus_rtu/mqtt_link/ota) imports MicroPython builtins
# and is validated on-device, not in CI.

[project]
name = "smartfarmview-pico-watchdog"
version = "0.1.0"
requires-python = ">=3.13"

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "mpremote",   # Pico 2 W flash/copy/run tool
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["firmware", "scripts"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
