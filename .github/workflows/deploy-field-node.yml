name: Deploy — field-node

on:
  push:
    branches: [main]
    paths:
      - "packages/field-node/**"
      - "packages/power-policy/**"
      - "infra/nodes.json"
  workflow_dispatch:
    inputs:
      node_id:
        description: "Deploy to a specific node ID (leave blank for all nodes)"
        required: false
        default: ""

jobs:
  # Read infra/nodes.json and build the matrix, optionally filtering to one node.
  load-matrix:
    runs-on: ubuntu-latest
    outputs:
      nodes: ${{ steps.filter.outputs.nodes }}
    steps:
      - uses: actions/checkout@v4

      - name: Build node matrix
        id: filter
        run: |
          # Only field nodes get the field-node deploy — the gateway and the
          # Pico watchdog live in nodes.json too but are provisioned differently.
          NODE_ID="${{ github.event.inputs.node_id }}"
          if [ -n "$NODE_ID" ]; then
            NODES=$(jq -c "[.nodes[] | select(.id == \"$NODE_ID\" and .type == \"field-node\")]" infra/nodes.json)
          else
            NODES=$(jq -c '[.nodes[] | select(.type == "field-node")]' infra/nodes.json)
          fi
          echo "nodes=$NODES" >> $GITHUB_OUTPUT

  deploy:
    needs: load-matrix
    if: ${{ needs.load-matrix.outputs.nodes != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # keep deploying other nodes if one fails
      matrix:
        node: ${{ fromJson(needs.load-matrix.outputs.nodes) }}
    name: "Deploy → ${{ matrix.node.id }}"

    steps:
      - uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PI_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ matrix.node.ip }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync code
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='tests/' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.venv/' \
            --exclude='*.egg-info' \
            --exclude='captures/' \
            --exclude='.env' \
            --exclude='models/' \
            -e "ssh -i ~/.ssh/deploy_key" \
            packages/field-node/ \
            techno@${{ matrix.node.ip }}:/opt/field-node/

      # Run pi-setup.sh on every deploy — it's idempotent and skips apt when
      # packages are already installed, so re-runs are fast (~5s).
      # This ensures new apt packages, sudoers rules, and system config are
      # applied automatically without manual SSH.
      - name: Run provisioning (idempotent)
        run: |
          ssh -i ~/.ssh/deploy_key techno@${{ matrix.node.ip }} \
            "sudo bash /opt/field-node/scripts/pi-setup.sh"

      # Sync the shared lib AFTER provisioning: pi-setup.sh creates
      # /opt/power-policy (techno-owned). /opt is root-owned, so rsync cannot
      # create that directory itself on a fresh node.
      - name: Sync shared power-policy lib
        run: |
          rsync -az --delete \
            --exclude='.git' \
            --exclude='tests/' \
            --exclude='*.pyc' \
            --exclude='__pycache__' \
            --exclude='.venv/' \
            --exclude='*.egg-info' \
            -e "ssh -i ~/.ssh/deploy_key" \
            packages/power-policy/ \
            techno@${{ matrix.node.ip }}:/opt/power-policy/

      # Install the shared lib editable first so the field-node dependency on
      # `smartfarmview-power-policy` resolves locally (it is not on PyPI).
      - name: Install shared power-policy lib
        run: |
          ssh -i ~/.ssh/deploy_key techno@${{ matrix.node.ip }} \
            "/opt/field-node/.venv/bin/pip install -e '/opt/power-policy' --quiet"

      - name: Install Python dependencies
        run: |
          ssh -i ~/.ssh/deploy_key techno@${{ matrix.node.ip }} \
            "/opt/field-node/.venv/bin/pip install -e '/opt/field-node/.[hardware]' --quiet"

      - name: Restart service
        run: |
          ssh -i ~/.ssh/deploy_key techno@${{ matrix.node.ip }} \
            "sudo systemctl restart field-node"

      - name: Health check
        run: |
          ssh -i ~/.ssh/deploy_key techno@${{ matrix.node.ip }} \
            "timeout 15 bash -c 'until systemctl is-active --quiet field-node; do sleep 1; done'"
