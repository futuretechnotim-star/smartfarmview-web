name: CI — gateway-node

on:
  push:
    paths:
      - "packages/gateway-node/**"
      - "packages/power-policy/**"
  pull_request:
    paths:
      - "packages/gateway-node/**"
      - "packages/power-policy/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/gateway-node

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Shared power-budget policy lib — install editable first so the
      # `smartfarmview-power-policy` requirement resolves locally (not on PyPI).
      - name: Install shared power-policy lib
        run: pip install -e ../power-policy

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check src/ tests/

      - name: Format check (ruff)
        run: ruff format --check src/ tests/

      - name: Type check (mypy)
        run: mypy src/

      - name: Unit tests
        run: pytest tests/ -v --cov=gateway_node --cov-report=term-missing
